name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version without the v prefix
        required: true
        type: string
      publish:
        description: Create the GitHub release after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build and validate Unix package
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.target }}" == 'aarch64-unknown-linux-gnu' ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --manifest-path skills/mise/mise-skills/Cargo.toml --target "${{ matrix.target }}"
          binary="skills/mise/mise-skills/target/${{ matrix.target }}/release/skills"
          test -x "$binary"
          mkdir -p dist
          archive="dist/skills_${{ inputs.version }}_${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$binary")" -czf "$archive" "$(basename "$binary")"
          test "$(tar -tzf "$archive")" = skills
      - name: Build and validate Windows package
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --manifest-path skills/mise/mise-skills/Cargo.toml --target '${{ matrix.target }}' --bin skills save_if_changed_replaces_an_existing_config
          cargo build --release --manifest-path skills/mise/mise-skills/Cargo.toml --target '${{ matrix.target }}'
          $binary = "skills/mise/mise-skills/target/${{ matrix.target }}/release/skills.exe"
          if (-not (Test-Path -Path $binary -PathType Leaf)) { throw "missing release binary: $binary" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/skills_${{ inputs.version }}_${{ matrix.target }}.zip"
          Compress-Archive -Path $binary -DestinationPath $archive -Force
          if ((Get-Command tar -ErrorAction SilentlyContinue) -ne $null) {
            $entries = tar -tf $archive
            if ($entries -notcontains 'skills.exe') { throw "invalid Windows package contents: $entries" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Validate and publish release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate compatibility manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from urllib.parse import urlparse

          manifest = json.load(open('release-compatibility.json', encoding='utf-8'))
          version = os.environ['RELEASE_VERSION']
          assert version in manifest['releases'], version
          release = manifest['releases'][version]
          plugin_url = release['plugin_url']
          plugin_revision = release['plugin_revision']
          parsed = urlparse(plugin_url)
          assert parsed.scheme == 'https' and parsed.netloc, plugin_url
          assert not parsed.username and not parsed.password, plugin_url
          assert not parsed.query and not parsed.fragment, plugin_url
          assert parsed.path.endswith('.git'), plugin_url
          assert not any(character.isspace() or ord(character) < 32 for character in plugin_url), plugin_url
          assert re.fullmatch(r'[0-9a-fA-F]{40}', plugin_revision), plugin_revision
          subprocess.run(
              ['git', 'ls-remote', '--exit-code', plugin_url],
              check=True,
              capture_output=True,
              text=True,
          )
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(['git', 'init', '--quiet', directory], check=True)
              subprocess.run(
                  [
                      'git', '-C', directory, 'fetch', '--quiet', '--no-tags',
                      '--depth=1', plugin_url, plugin_revision,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              subprocess.run(
                  ['git', '-C', directory, 'cat-file', '-e', f'{plugin_revision}^{{commit}}'],
                  check=True,
              )
          PY
      - name: Validate release packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          expected = {
              f'skills_{version}_x86_64-unknown-linux-gnu.tar.gz',
              f'skills_{version}_aarch64-unknown-linux-gnu.tar.gz',
              f'skills_{version}_x86_64-apple-darwin.tar.gz',
              f'skills_{version}_aarch64-apple-darwin.tar.gz',
              f'skills_{version}_x86_64-pc-windows-msvc.zip',
          }
          actual = {path.name for path in Path('dist').glob('skills_*')}
          assert actual == expected, (actual, expected)
          for path in Path('dist').glob('*.tar.gz'):
              with tarfile.open(path) as archive:
                  assert archive.getnames() == ['skills'], (path, archive.getnames())
          for path in Path('dist').glob('*.zip'):
              with zipfile.ZipFile(path) as archive:
                  assert archive.namelist() == ['skills.exe'], (path, archive.namelist())
          PY
      - name: Checksums
        run: sha256sum dist/skills_* > dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: skills v${{ inputs.version }}
          files: |
            dist/*
            release-compatibility.json
