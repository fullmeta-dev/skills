name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version without the v prefix
        required: true
        type: string
      publish:
        description: Create the GitHub release after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build and package
        run: |
          if [[ "${{ matrix.target }}" == 'aarch64-unknown-linux-gnu' ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cargo build --release --manifest-path skills/mise/mise-skills/Cargo.toml --target "${{ matrix.target }}"
            mkdir -p dist
            cp "skills/mise/mise-skills/target/${{ matrix.target }}/release/skills.exe" "dist/skills_${{ inputs.version }}_${{ matrix.target }}.exe"
          else
            cargo build --release --manifest-path skills/mise/mise-skills/Cargo.toml --target "${{ matrix.target }}"
            mkdir -p dist
            tar -C "skills/mise/mise-skills/target/${{ matrix.target }}/release" -czf "dist/skills_${{ inputs.version }}_${{ matrix.target }}.tar.gz" skills
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.target }}
          path: dist/*

  publish:
    name: Validate and publish release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate compatibility manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('release-compatibility.json', encoding='utf-8'))
          version = os.environ['RELEASE_VERSION']
          assert version in manifest['releases'], version
          assert manifest['releases'][version]['plugin_revision']
          PY
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: skills v${{ inputs.version }}
          files: |
            dist/*
            release-compatibility.json
