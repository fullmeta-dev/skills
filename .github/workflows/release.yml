name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out the dispatched tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Derive and verify release version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release must be dispatched at a vX.Y.Z tag (got ${GITHUB_REF_NAME})" >&2; exit 1 ;;
          esac
          cargo_version="$(python3 - <<'PY'
          import tomllib
          with open('packages/skills/Cargo.toml', 'rb') as stream:
              print(tomllib.load(stream)['package']['version'])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          test "${cargo_version}" = "${tag_version}" || {
            echo "Cargo version ${cargo_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          tag_sha="$(git rev-parse HEAD)"
          test "${tag_sha}" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          {
            echo "RELEASE_VERSION=${cargo_version}"
            echo "RELEASE_TAG_SHA=${tag_sha}"
          } >> "${GITHUB_ENV}"
      - name: Build and validate release package
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/package-release.sh "${RELEASE_VERSION}" dist "${{ matrix.target }}"
          test -f "dist/skills_${RELEASE_VERSION}_${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.target }}
          path: dist/skills_*
          if-no-files-found: error

  publish:
    name: Publish tagged release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dispatched tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Derive and verify tagged Cargo version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release must be dispatched at a vX.Y.Z tag (got ${GITHUB_REF_NAME})" >&2; exit 1 ;;
          esac
          cargo_version="$(python3 - <<'PY'
          import tomllib
          with open('packages/skills/Cargo.toml', 'rb') as stream:
              print(tomllib.load(stream)['package']['version'])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          test "${cargo_version}" = "${tag_version}" || {
            echo "Cargo version ${cargo_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          tag_sha="$(git rev-parse HEAD)"
          test "${tag_sha}" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          echo "RELEASE_VERSION=${cargo_version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG_SHA=${tag_sha}" >> "${GITHUB_ENV}"
      - name: Generate immutable compatibility manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          tag_sha = os.environ['RELEASE_TAG_SHA']
          manifest = {
              'schema_version': 1,
              'repository': 'fullmeta-dev/skills',
              'latest': version,
              'releases': {
                  version: {
                      'minimum_mise': '2026.11.7',
                      'plugin_url': 'https://github.com/fullmeta-dev/skills.git',
                      'plugin_revision': tag_sha,
                      'asset_pattern': 'skills_*',
                  },
              },
          }
          Path('dist/release-compatibility.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="skills_${RELEASE_VERSION}_x86_64-unknown-linux-gnu.tar.gz skills_${RELEASE_VERSION}_aarch64-apple-darwin.tar.gz"
          for asset in ${expected}; do
            test -f "dist/${asset}"
            test "$(tar -tzf "dist/${asset}")" = skills
          done
          test "$(find dist -maxdepth 1 -type f -name 'skills_*' | wc -l | tr -d ' ')" = 2
          python3 - "${RELEASE_VERSION}" "${RELEASE_TAG_SHA}" <<'PY'
          import json
          import sys
          with open('dist/release-compatibility.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          version, tag_sha = sys.argv[1:]
          assert manifest['latest'] == version
          assert manifest['releases'][version]['plugin_revision'] == tag_sha
          PY
          (cd dist && sha256sum skills_* release-compatibility.json > SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: skills ${{ github.ref_name }}
          files: |
            dist/skills_*
            dist/SHA256SUMS
            dist/release-compatibility.json
