[package]
name = "mise-skills"
version = "0.1.0"
edition = "2021"
description = "Deterministic discovery and selection for Agent Skills"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
