[package]
name = "skills"
version = "0.2.1"
edition = "2021"
description = "Deterministic discovery and selection for Agent Skills"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
fslock = "0.2"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
walkdir = "2"
