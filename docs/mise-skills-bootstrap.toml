# Global mise-skills bootstrap configuration.
# This file is a complete config artifact. The plugin and CLI revisions are
# deliberately immutable; the pre-tools hook only installs the pinned plugin.

[settings]
experimental = true

[plugins]
"vfox-backend:skills" = "https://github.com/fullmeta-dev/skills.git#348a5b2021d1e8b6d398c1da068fee90bb1c3653"

[tools."github:fullmeta-dev/skills"]
version = "0.1.0"
bin = "mise-skills"
asset_pattern = "mise-skills"

[tasks.skills]
description = "Manage Agent Skills"
usage = '''
arg "[arguments]" var=#true help="mise-skills command and arguments"
'''
dir = "{{cwd}}"
run = "mise-skills ${usage_arguments-}"
raw = true

[bootstrap.hooks.pre-tools]
run = "bash ${MISE_CONFIG_DIR:-$HOME/.config/mise}/mise-skills-bootstrap-plugin.sh skills https://github.com/fullmeta-dev/skills.git 348a5b2021d1e8b6d398c1da068fee90bb1c3653"
